# tracer: lightweight log/trace collector for the cluster itself.
# Source: https://github.com/iresharma/tracer
#
# The agent DaemonSet runs one pod per node with hostPath mounts on
# /var/log (read-only) and /var/lib/tracer-agent, and no ServiceAccount —
# it never talks to the API server, all pod/namespace/container metadata
# comes from the kubelet's on-disk log path naming. If this cluster
# enforces a restricted Pod Security admission policy on tenant
# namespaces, the hostPath volumes below may be rejected — that's the
# first thing to check if the agent pods fail to schedule.
#
# Image tags are bumped automatically by tracer's CI (build-and-deploy.yml
# in the tracer repo) on every push to its main branch — don't hand-edit
# the `image:` lines below, they'll be overwritten on the next build.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracer-collector-config
  namespace: iresharma
data:
  HTTP_ADDR: ":8080"
  DB_PATH: "/data/tracer.db"
  RETENTION_DAYS: "10"
  TRACE_SEARCH_WINDOW_DAYS: "2"
  SQLITE_CACHE_KB: "16000"
  INGEST_CHAN_CAPACITY: "5000"
  WRITER_FLUSH_MS: "200"
  WRITER_FLUSH_SIZE: "500"
---
# local-path (node-local), not an NFS-backed class: SQLite needs reliable
# POSIX file locking that NFS doesn't provide (same lesson as
# seeksphere-core-api-dynamodb-local's PVC in this repo). Sizing rule of
# thumb: bytes/day ~= lines/day * ~300 bytes/row; adjust `storage` to your
# actual log volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracer-collector-data
  namespace: iresharma
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
# replicas is fixed at 1 with strategy Recreate: SQLite is single-writer /
# single-instance storage, so two collector pods must never mount the RWO
# PVC at the same time. Recreate guarantees the old pod is fully torn down
# before the new one starts during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracer-collector
  namespace: iresharma
  labels:
    app: tracer-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracer-collector
  template:
    metadata:
      labels:
        app: tracer-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: collector
          image: iresharma/tracer-collector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: tracer-collector-config
          env:
            - name: GOMEMLIMIT
              value: "400MiB"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracer-collector-data
---
# ClusterIP only, deliberately no Ingress: tracer's UI and JSON API
# (including an ad-hoc read-only SQL query page against the log database)
# have no authentication in front of them. Reach it with
# `kubectl -n iresharma port-forward svc/tracer-collector 8080:80`, or add
# your own authenticating Ingress if you want it reachable without a
# port-forward.
apiVersion: v1
kind: Service
metadata:
  name: tracer-collector
  namespace: iresharma
spec:
  type: ClusterIP
  selector:
    app: tracer-collector
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracer-agent-config
  namespace: iresharma
data:
  COLLECTOR_URL: "http://tracer-collector.iresharma.svc.cluster.local"
  TRACE_ID_FIELD: "trace_id"
  LOG_ROOT: "/var/log/pods"
  CHECKPOINT_PATH: "/var/lib/tracer-agent/checkpoints.json"
  POLL_INTERVAL: "250ms"
  RESCAN_INTERVAL: "30s"
  MAX_LINE_BYTES: "262144"
  FLUSH_INTERVAL: "2s"
  MAX_BATCH_SIZE: "500"
  MAX_BATCH_BYTES: "524288"
  RING_BUFFER_CAPACITY: "20"
  CHECKPOINT_FLUSH_INTERVAL: "3s"
  START_AT_END: "true"
---
# No ServiceAccount / RBAC objects here — intentional. The agent derives
# all namespace/pod/container metadata from the kubelet's on-disk log path
# naming (/var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log) and
# never talks to the Kubernetes API server, so it needs no permissions
# there. It does need the two hostPath mounts below, which is the part
# most likely to need cluster-admin sign-off in a multi-tenant setup.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tracer-agent
  namespace: iresharma
  labels:
    app: tracer-agent
spec:
  selector:
    matchLabels:
      app: tracer-agent
  template:
    metadata:
      labels:
        app: tracer-agent
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: agent
          image: iresharma/tracer-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tracer-agent-config
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            # Mounting the whole /var/log tree (not just /var/log/pods) is
            # deliberate: pod log entries under /var/log/pods are typically
            # symlinks resolving through /var/log/containers into
            # runtime-specific storage, and mounting the parent guarantees
            # those symlink chains resolve regardless of container runtime.
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # hostPath (not emptyDir) so checkpoints survive agent pod
            # restarts on the same node.
            - name: checkpoints
              mountPath: /var/lib/tracer-agent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: checkpoints
          hostPath:
            path: /var/lib/tracer-agent
            type: DirectoryOrCreate
