# Grafana sidecar ConfigMap for kube-prometheus-stack.
# Drop this into homelab-infra-charts (pushgateway chart templates, or any
# ArgoCD app that syncs into a namespace the Grafana sidecar watches).
#
# Sidecar settings already in kube-prometheus-stack values:
#   grafana.sidecar.dashboards.enabled: true
#   grafana.sidecar.dashboards.label: grafana_dashboard
#   grafana.sidecar.dashboards.labelValue: "1"
#   grafana.sidecar.dashboards.searchNamespace: ALL
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-engine-run-benchmarks
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Engine
