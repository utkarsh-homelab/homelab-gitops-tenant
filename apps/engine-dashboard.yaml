          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "engine_run_info{job=~\"$job\", instance=~\"$instance\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "expr": "engine_run_cost_usd{job=~\"$job\", instance=~\"$instance\"}",
              "legendFormat": "",
