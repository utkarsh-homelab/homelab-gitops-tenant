apiVersion: v1
kind: ConfigMap
metadata:
  name: engine-dashboard
  namespace: iresharma
  labels:
    # Picked up by the shared kube-prometheus-stack Grafana sidecar
    # (searchNamespace: ALL), which imports any ConfigMap carrying this
    # label as a dashboard - see charts/kube-prometheus-stack/values/prod.yaml
    # in homelab-infra-charts.
    grafana_dashboard: "1"
data:
  engine.json: |-
    {
      "title": "Engine Run Benchmarks",
      "uid": "engine-run-benchmarks",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "engine",
        "codeloom",
        "pushgateway"
      ],
      "description": "Codeloom engine run + TypeSafe System One metrics from Prometheus Pushgateway. Default grouping is job=engine, instance=session_id. Gauges are per-session totals retained until the grouping key is deleted. Histogram p95 uses rate() and is meaningful while a session is still pushing.",
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "current": {}
          },
          {
            "name": "job",
            "type": "query",
            "label": "Job",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(engine_run_info, job)",
            "definition": "label_values(engine_run_info, job)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {}
          },
          {
            "name": "instance",
            "type": "query",
            "label": "Session",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(engine_run_info{job=~\"$job\"}, instance)",
            "definition": "label_values(engine_run_info{job=~\"$job\"}, instance)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {}
          },
          {
            "name": "model",
            "type": "query",
            "label": "Model",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(engine_model_requests{job=~\"$job\"}, model)",
            "definition": "label_values(engine_model_requests{job=~\"$job\"}, model)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {}
          },
          {
            "name": "profile",
            "type": "query",
            "label": "Profile",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(engine_agent_spawned{job=~\"$job\"}, profile)",
            "definition": "label_values(engine_agent_spawned{job=~\"$job\"}, profile)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {}
          },
          {
            "name": "tag",
            "type": "query",
            "label": "Judge tag",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(engine_judge_requests{job=~\"$job\"}, tag)",
            "definition": "label_values(engine_judge_requests{job=~\"$job\"}, tag)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Sessions",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(engine_run_info{job=~\"$job\", instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "LLM cost",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
