apiVersion: v1
kind: ConfigMap
metadata:
  name: variable-bitrate-server-dashboard
  namespace: iresharma
  labels:
    # Picked up by the shared kube-prometheus-stack Grafana sidecar
    # (searchNamespace: ALL), which imports any ConfigMap carrying this
    # label as a dashboard - see charts/kube-prometheus-stack/values/prod.yaml
    # in homelab-infra-charts.
    grafana_dashboard: "1"
data:
  hls-server.json: |-
    {
      "title": "HLS/DASH Streaming Server",
      "uid": "hls-server",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "tags": ["hls-server", "streaming"],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        { "id": 1, "type": "row", "title": "Overview", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "id": 2, "type": "stat", "title": "Videos in Library",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "targets": [{ "expr": "hls_server_videos_total", "legendFormat": "videos", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3, "type": "stat", "title": "Pipeline Jobs Active",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "targets": [{ "expr": "hls_server_pipeline_jobs_active", "legendFormat": "active", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 4, "type": "stat", "title": "HLS Encodes Active",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "targets": [{ "expr": "hls_server_encode_jobs_active{format=\"hls\"}", "legendFormat": "hls", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 5, "type": "stat", "title": "DASH Encodes Active",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "targets": [{ "expr": "hls_server_encode_jobs_active{format=\"dash\"}", "legendFormat": "dash", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 6, "type": "stat", "title": "Throttle",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "targets": [{ "expr": "hls_server_throttle_kbps", "legendFormat": "kbps", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "Kbits", "mappings": [{ "type": "value", "options": { "0": { "text": "disabled" } } }] }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },

        { "id": 10, "type": "row", "title": "HTTP Traffic", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 } },
        {
          "id": 11, "type": "timeseries", "title": "Request Rate by Route",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [{ "expr": "sum by (route) (rate(hls_server_http_requests_total[$__rate_interval]))", "legendFormat": "{{route}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 12, "type": "timeseries", "title": "Request Rate by Status Code",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [{ "expr": "sum by (status_code) (rate(hls_server_http_requests_total[$__rate_interval]))", "legendFormat": "{{status_code}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 13, "type": "timeseries", "title": "Request Latency (p50/p95/p99)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(hls_server_http_request_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(hls_server_http_request_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(hls_server_http_request_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p99", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 14, "type": "timeseries", "title": "5xx Error Rate",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [{ "expr": "100 * sum(rate(hls_server_http_requests_total{status_code=~\"5..\"}[$__rate_interval])) / sum(rate(hls_server_http_requests_total[$__rate_interval]))", "legendFormat": "5xx %", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0 }, "overrides": [] }
        },

        { "id": 20, "type": "row", "title": "Uploads & Pipeline", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 } },
        {
          "id": 21, "type": "timeseries", "title": "Upload Outcomes",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "targets": [{ "expr": "sum by (outcome) (rate(hls_server_video_uploads_total[$__rate_interval]))", "legendFormat": "{{outcome}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "id": 22, "type": "timeseries", "title": "Pipeline Completions by Outcome",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "targets": [{ "expr": "sum by (outcome) (rate(hls_server_pipeline_jobs_total[$__rate_interval]))", "legendFormat": "{{outcome}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "id": 23, "type": "timeseries", "title": "Pipeline Jobs Active",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "targets": [{ "expr": "hls_server_pipeline_jobs_active", "legendFormat": "active", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 24, "type": "timeseries", "title": "Videos in Library",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "targets": [{ "expr": "hls_server_videos_total", "legendFormat": "videos", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },

        { "id": 30, "type": "row", "title": "Encoding", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 39 } },
        {
          "id": 31, "type": "timeseries", "title": "Encode Duration (p50/p95 by format)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le, format) (rate(hls_server_encode_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "{{format}} p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le, format) (rate(hls_server_encode_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "{{format}} p95", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 32, "type": "timeseries", "title": "Encode Jobs Active by Format",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "targets": [{ "expr": "hls_server_encode_jobs_active", "legendFormat": "{{format}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 33, "type": "timeseries", "title": "Encode Completions by Format/Outcome",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 48 },
          "targets": [{ "expr": "sum by (format, outcome) (rate(hls_server_encode_duration_seconds_count[$__rate_interval]))", "legendFormat": "{{format}} - {{outcome}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },

        { "id": 40, "type": "row", "title": "Delivery", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 56 } },
        {
          "id": 41, "type": "timeseries", "title": "Bytes Streamed by Protocol",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 57 },
          "targets": [{ "expr": "sum by (protocol) (rate(hls_server_bytes_streamed_total[$__rate_interval]))", "legendFormat": "{{protocol}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] }
        },
        {
          "id": 42, "type": "timeseries", "title": "Simulated Throttle",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 57 },
          "targets": [{ "expr": "hls_server_throttle_kbps", "legendFormat": "kbps", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "Kbits" }, "overrides": [] }
        },

        { "id": 50, "type": "row", "title": "Disk Usage", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 65 } },
        {
          "id": 51, "type": "timeseries", "title": "Disk Used % by Path",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 66 },
          "targets": [{ "expr": "100 * (1 - (hls_server_disk_bytes{type=\"free\"} / ignoring(type) hls_server_disk_bytes{type=\"total\"}))", "legendFormat": "{{path}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
        },
        {
          "id": 52, "type": "timeseries", "title": "Disk Free by Path",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 66 },
          "targets": [{ "expr": "hls_server_disk_bytes{type=\"free\"}", "legendFormat": "{{path}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },

        { "id": 60, "type": "row", "title": "Node.js Runtime", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 74 } },
        {
          "id": 61, "type": "timeseries", "title": "Heap Used / Total",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 75 },
          "targets": [
            { "expr": "hls_server_nodejs_heap_size_used_bytes", "legendFormat": "used", "refId": "A" },
            { "expr": "hls_server_nodejs_heap_size_total_bytes", "legendFormat": "total", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },
        {
          "id": 62, "type": "timeseries", "title": "Event Loop Lag",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 75 },
          "targets": [
            { "expr": "hls_server_nodejs_eventloop_lag_mean_seconds", "legendFormat": "mean", "refId": "A" },
            { "expr": "hls_server_nodejs_eventloop_lag_p99_seconds", "legendFormat": "p99", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 63, "type": "timeseries", "title": "GC Duration Rate",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 83 },
          "targets": [{ "expr": "sum by (kind) (rate(hls_server_nodejs_gc_duration_seconds_sum[$__rate_interval]))", "legendFormat": "{{kind}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 64, "type": "timeseries", "title": "Active Handles / Requests",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 83 },
          "targets": [
            { "expr": "hls_server_nodejs_active_handles_total", "legendFormat": "handles", "refId": "A" },
            { "expr": "hls_server_nodejs_active_requests_total", "legendFormat": "requests", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },

        { "id": 70, "type": "row", "title": "Pod Resources (CPU & Memory)", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 91 } },
        {
          "id": 71, "type": "timeseries", "title": "CPU Usage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 92 },
          "targets": [
            { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"iresharma\", pod=~\"variable-bitrate-server-.*\", container!=\"\", container!=\"POD\"}[$__rate_interval]))", "legendFormat": "{{pod}}", "refId": "A" },
            { "expr": "sum(kube_pod_container_resource_limits{namespace=\"iresharma\", pod=~\"variable-bitrate-server-.*\", resource=\"cpu\"})", "legendFormat": "limit", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 72, "type": "timeseries", "title": "Memory Usage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 92 },
          "targets": [
            { "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"iresharma\", pod=~\"variable-bitrate-server-.*\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "refId": "A" },
            { "expr": "sum(kube_pod_container_resource_limits{namespace=\"iresharma\", pod=~\"variable-bitrate-server-.*\", resource=\"memory\"})", "legendFormat": "limit", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        }
      ]
    }
