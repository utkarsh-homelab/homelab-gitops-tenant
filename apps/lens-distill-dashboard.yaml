apiVersion: v1
kind: ConfigMap
metadata:
  name: lens-distill-dashboard
  namespace: iresharma
  labels:
    # Picked up by the shared kube-prometheus-stack Grafana sidecar
    # (searchNamespace: ALL), which imports any ConfigMap carrying this
    # label as a dashboard - see charts/kube-prometheus-stack/values/prod.yaml
    # in homelab-infra-charts.
    grafana_dashboard: "1"
data:
  lens-distill.json: |-
    {
      "title": "Lens Distill",
      "uid": "lens-distill",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "tags": ["lens-distill", "pipeline"],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        { "id": 1, "type": "row", "title": "Overview", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "id": 2, "type": "stat", "title": "Books Completed (Ready)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "targets": [{ "expr": "sum(pipeline_books_completed_total{status=\"ready\"})", "legendFormat": "ready", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3, "type": "stat", "title": "Books Failed",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "targets": [{ "expr": "sum(pipeline_books_completed_total{status=\"failed\"})", "legendFormat": "failed", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 4, "type": "stat", "title": "Queue Depth",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "targets": [{ "expr": "sum(pipeline_queue_depth)", "legendFormat": "queued", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 5, "type": "stat", "title": "Quota Remaining",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "targets": [{ "expr": "pipeline_quota_remaining", "legendFormat": "remaining", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 6, "type": "stat", "title": "HTTP Active Requests",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "targets": [{ "expr": "sum(http_server_active_requests)", "legendFormat": "active", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },

        { "id": 10, "type": "row", "title": "HTTP Traffic", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 } },
        {
          "id": 11, "type": "timeseries", "title": "Request Rate by Route",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [{ "expr": "sum by (http_route) (rate(http_server_requests_total[$__rate_interval]))", "legendFormat": "{{http_route}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 12, "type": "timeseries", "title": "Request Rate by Status Code",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [{ "expr": "sum by (http_response_status_code) (rate(http_server_requests_total[$__rate_interval]))", "legendFormat": "{{http_response_status_code}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 13, "type": "timeseries", "title": "Request Latency (p50/p95/p99)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_duration_bucket[$__rate_interval])))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_duration_bucket[$__rate_interval])))", "legendFormat": "p95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_duration_bucket[$__rate_interval])))", "legendFormat": "p99", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] }
        },
        {
          "id": 14, "type": "timeseries", "title": "5xx Error Rate",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [{ "expr": "100 * sum(rate(http_server_requests_total{http_response_status_code=~\"5..\"}[$__rate_interval])) / sum(rate(http_server_requests_total[$__rate_interval]))", "legendFormat": "5xx %", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0 }, "overrides": [] }
        },

        { "id": 20, "type": "row", "title": "Pipeline", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 } },
        {
          "id": 21, "type": "timeseries", "title": "Jobs Claimed by Stage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "targets": [{ "expr": "sum by (stage) (rate(pipeline_jobs_claimed_total[$__rate_interval]))", "legendFormat": "{{stage}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "id": 22, "type": "timeseries", "title": "Jobs Failed / Deadlettered by Stage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "targets": [
            { "expr": "sum by (stage) (rate(pipeline_jobs_failed_total[$__rate_interval]))", "legendFormat": "{{stage}} failed", "refId": "A" },
            { "expr": "sum by (stage) (rate(pipeline_jobs_deadlettered_total[$__rate_interval]))", "legendFormat": "{{stage}} deadlettered", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "id": 23, "type": "timeseries", "title": "Queue Depth by Stage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "targets": [{ "expr": "pipeline_queue_depth", "legendFormat": "{{stage}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 24, "type": "timeseries", "title": "Stage Duration (p50/p95 by stage)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le, stage) (rate(pipeline_stage_duration_bucket[$__rate_interval])))", "legendFormat": "{{stage}} p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le, stage) (rate(pipeline_stage_duration_bucket[$__rate_interval])))", "legendFormat": "{{stage}} p95", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] }
        },
        {
          "id": 25, "type": "timeseries", "title": "Stage Failures by Stage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 39 },
          "targets": [{ "expr": "sum by (stage) (rate(pipeline_stage_failed_total[$__rate_interval]))", "legendFormat": "{{stage}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "id": 26, "type": "timeseries", "title": "Book Pipeline Duration (p50/p95)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 39 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(pipeline_book_duration_bucket[$__rate_interval])))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(pipeline_book_duration_bucket[$__rate_interval])))", "legendFormat": "p95", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] }
        },
        {
          "id": 27, "type": "timeseries", "title": "Books Completed by Status",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 47 },
          "targets": [{ "expr": "sum by (status) (rate(pipeline_books_completed_total[$__rate_interval]))", "legendFormat": "{{status}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "id": 28, "type": "timeseries", "title": "Quota Remaining & Exceeded",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 47 },
          "targets": [
            { "expr": "pipeline_quota_remaining", "legendFormat": "remaining", "refId": "A" },
            { "expr": "sum(rate(pipeline_quota_exceeded_count_total[$__rate_interval]))", "legendFormat": "exceeded/s", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },

        { "id": 30, "type": "row", "title": "LLM", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 56 } },
        {
          "id": 31, "type": "timeseries", "title": "LLM Call Duration (p50/p95 by model)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 57 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le, gen_ai_request_model) (rate(llm_call_duration_bucket[$__rate_interval])))", "legendFormat": "{{gen_ai_request_model}} p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(llm_call_duration_bucket[$__rate_interval])))", "legendFormat": "{{gen_ai_request_model}} p95", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] }
        },
        {
          "id": 32, "type": "timeseries", "title": "Tokens Billed by Stage (Input/Output)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 57 },
          "targets": [
            { "expr": "sum by (stage) (rate(pipeline_tokens_input_total[$__rate_interval]))", "legendFormat": "{{stage}} input", "refId": "A" },
            { "expr": "sum by (stage) (rate(pipeline_tokens_output_total[$__rate_interval]))", "legendFormat": "{{stage}} output", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 33, "type": "timeseries", "title": "Per-Call Token Usage (p50/p95)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 65 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le, gen_ai_token_type) (rate(gen_ai_client_token_usage_bucket[$__rate_interval])))", "legendFormat": "{{gen_ai_token_type}} p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le, gen_ai_token_type) (rate(gen_ai_client_token_usage_bucket[$__rate_interval])))", "legendFormat": "{{gen_ai_token_type}} p95", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 34, "type": "timeseries", "title": "Estimated Cost by Stage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 65 },
          "targets": [{ "expr": "sum by (stage) (rate(pipeline_cost_estimated_usd_total[$__rate_interval]))", "legendFormat": "{{stage}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "currencyUSD" }, "overrides": [] }
        },
        {
          "id": 35, "type": "timeseries", "title": "LLM Call Errors by Model",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 73 },
          "targets": [{ "expr": "sum by (gen_ai_request_model, error_kind) (rate(llm_call_errors_total[$__rate_interval]))", "legendFormat": "{{gen_ai_request_model}} - {{error_kind}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },
        {
          "id": 36, "type": "timeseries", "title": "LLM Fallback Count by Reason",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 73 },
          "targets": [{ "expr": "sum by (reason) (rate(llm_fallback_count_total[$__rate_interval]))", "legendFormat": "{{reason}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] }
        },

        { "id": 40, "type": "row", "title": "Node.js Runtime", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 82 } },
        {
          "id": 41, "type": "timeseries", "title": "Event Loop Lag (mean/p99)",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 83 },
          "targets": [
            { "expr": "nodejs_eventloop_delay_mean", "legendFormat": "mean", "refId": "A" },
            { "expr": "nodejs_eventloop_delay_p99", "legendFormat": "p99", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] }
        },
        {
          "id": 42, "type": "timeseries", "title": "Process Uptime",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 83 },
          "targets": [{ "expr": "process_uptime", "legendFormat": "uptime", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },

        { "id": 50, "type": "row", "title": "Pod Resources (CPU & Memory)", "collapsed": false, "panels": [], "gridPos": { "h": 1, "w": 24, "x": 0, "y": 91 } },
        {
          "id": 51, "type": "timeseries", "title": "CPU Usage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 92 },
          "targets": [
            { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"iresharma\", pod=~\"lens-distill-.*\", container!=\"\", container!=\"POD\"}[$__rate_interval]))", "legendFormat": "{{pod}}", "refId": "A" },
            { "expr": "sum(kube_pod_container_resource_limits{namespace=\"iresharma\", pod=~\"lens-distill-.*\", resource=\"cpu\"})", "legendFormat": "limit", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 52, "type": "timeseries", "title": "Memory Usage",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 92 },
          "targets": [
            { "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"iresharma\", pod=~\"lens-distill-.*\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "refId": "A" },
            { "expr": "sum(kube_pod_container_resource_limits{namespace=\"iresharma\", pod=~\"lens-distill-.*\", resource=\"memory\"})", "legendFormat": "limit", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        }
      ]
    }
