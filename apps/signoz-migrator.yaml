apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-schema-migrator
  namespace: iresharma
  annotations:
    # A PreSync hook would run before ClickHouse/ZooKeeper themselves are
    # applied (they're normal resources in this same app), so the
    # wait-for-clickhouse init container would deadlock waiting for a
    # ClickHouse that doesn't exist yet. Sync waves instead let clickhouse's
    # own wave (0, the default) go Healthy first, then run this Job, then
    # bring up query-service/otel-collector/frontend in a later wave.
    # Re-running sync/async against an already-migrated schema is a no-op,
    # so this is safe to repeat on every sync.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O- http://clickhouse:8123/ping; do
                echo "waiting for clickhouse..."
                sleep 5
              done
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
        - name: schema-migrator-sync
          image: signoz/signoz-schema-migrator:0.111.24
          # `args`, not `command`: unlike docker-compose's `command:` (which
          # appends to the image's ENTRYPOINT), Kubernetes' `command:`
          # replaces it outright - which turned "sync" into busybox's
          # unrelated `sync` coreutil instead of a subcommand of this
          # image's actual entrypoint binary.
          args:
            - sync
            - "--dsn=tcp://clickhouse:9000"
            - "--up="
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
      containers:
        - name: schema-migrator-async
          image: signoz/signoz-schema-migrator:0.111.24
          args:
            - async
            - "--dsn=tcp://clickhouse:9000"
            - "--up="
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
