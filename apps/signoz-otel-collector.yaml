# Trimmed from SigNoz v0.69.0's reference otel-collector-config.yaml:
# dropped the tcplog/docker receiver (Docker-host log tailing, meaningless in
# k8s), opencensus receiver (legacy, unused), and hostmetrics receiver (needs
# a hostPath /hostfs mount for node-level metrics - out of scope for
# per-app OpenTelemetry instrumentation). otlp/jaeger/prometheus receivers
# and the traces/metrics/logs pipelines into ClickHouse are unchanged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-otel-collector-config
  namespace: iresharma
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      prometheus:
        config:
          global:
            scrape_interval: 60s
          scrape_configs:
            # otel-collector internal metrics
            - job_name: otel-collector
              static_configs:
              - targets:
                  - localhost:8888
                labels:
                  job_name: otel-collector

    processors:
      batch:
        send_batch_size: 10000
        send_batch_max_size: 11000
        timeout: 10s
      signozspanmetrics/delta:
        metrics_exporter: clickhousemetricswrite
        metrics_flush_interval: 60s
        latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s ]
        dimensions_cache_size: 100000
        aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
        enable_exp_histogram: true
        dimensions:
          - name: service.namespace
            default: default
          - name: deployment.environment
            default: default
          # This is added to ensure the uniqueness of the timeseries
          # Otherwise, identical timeseries produced by multiple replicas of
          # collectors result in incorrect APM metrics
          - name: signoz.collector.id
          - name: service.version
          - name: browser.platform
          - name: browser.mobile
          - name: k8s.cluster.name
          - name: k8s.node.name
          - name: k8s.namespace.name
          - name: host.name
          - name: host.type
          - name: container.name

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679
      pprof:
        endpoint: 0.0.0.0:1777

    exporters:
      clickhousetraces:
        datasource: tcp://clickhouse:9000/signoz_traces
        low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
        use_new_schema: true
      clickhousemetricswrite:
        endpoint: tcp://clickhouse:9000/signoz_metrics
        resource_to_telemetry_conversion:
          enabled: true
      clickhousemetricswrite/prometheus:
        endpoint: tcp://clickhouse:9000/signoz_metrics
      clickhousemetricswritev2:
        dsn: tcp://clickhouse:9000/signoz_metrics
      clickhouselogsexporter:
        dsn: tcp://clickhouse:9000/signoz_logs
        timeout: 10s
        use_new_schema: true

    service:
      telemetry:
        logs:
          encoding: json
        metrics:
          address: 0.0.0.0:8888
      extensions:
        - health_check
        - zpages
        - pprof
      pipelines:
        traces:
          receivers: [jaeger, otlp]
          processors: [signozspanmetrics/delta, batch]
          exporters: [clickhousetraces]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhousemetricswrite, clickhousemetricswritev2]
        metrics/prometheus:
          receivers: [prometheus]
          processors: [batch]
          exporters: [clickhousemetricswrite/prometheus, clickhousemetricswritev2]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouselogsexporter]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: iresharma
  labels:
    app: otel-collector
  annotations:
    # Wait for clickhouse (wave 0, default) and the schema-migrator Job
    # (wave 1) to go Healthy first - see apps/signoz-migrator.yaml.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: signoz/signoz-otel-collector:0.111.24
          # `args`, not `command` - see apps/signoz-migrator.yaml for why:
          # Kubernetes' `command:` replaces the image's ENTRYPOINT (the
          # otelcol binary) instead of appending to it like docker-compose's
          # `command:` does.
          args:
            - "--config=/etc/otel-collector-config.yaml"
            - "--feature-gates=-pkg.translator.prometheus.NormalizeName"
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: host.name=signoz-otel-collector,os.type=linux
            - name: LOW_CARDINAL_EXCEPTION_GROUPING
              value: "false"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: jaeger-grpc
              containerPort: 14250
            - name: jaeger-thrift
              containerPort: 14268
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: 300m
      volumes:
        - name: config
          configMap:
            name: signoz-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: iresharma
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
    - name: jaeger-thrift
      port: 14268
      targetPort: 14268
  type: ClusterIP
