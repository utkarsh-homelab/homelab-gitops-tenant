apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-query-service-config
  namespace: iresharma
data:
  prometheus.yml: |
    # my global config
    global:
      scrape_interval:     5s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
      evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
      # scrape_timeout is set to the global default (10s).

    # Alertmanager configuration
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093

    # Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"
      - 'alerts.yml'

    # A scrape configuration containing exactly one endpoint to scrape:
    # Here it's Prometheus itself.
    scrape_configs: []

    remote_read:
      - url: tcp://clickhouse:9000/signoz_metrics
  alerts.yml: |
    groups:
    - name: ExampleCPULoadGroup
      rules:
      - alert: HighCpuLoad
        expr: system_cpu_load_average_1m > 0.1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: High CPU load
          description: "CPU load is > 0.1\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-frontend-config
  namespace: iresharma
data:
  nginx-config.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       3301;
        server_name  _;

        gzip on;
        gzip_static on;
        gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_proxied  any;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;

        # to handle uri issue 414 from nginx
        client_max_body_size 24M;
        large_client_header_buffers 8 128k;

        location / {
            if ( $uri = '/index.html' ) {
                add_header Cache-Control no-store always;
            }
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/api/(v1|v3)/logs/(tail|livetail){
            proxy_pass http://query-service:8080;
            proxy_http_version 1.1;

            # connection will be closed if no data is read for 600s between successive read operations
            proxy_read_timeout 600s;

            # dont buffer the data send it directly to client.
            proxy_buffering off;
            proxy_cache off;
        }

        location /api {
            proxy_pass http://query-service:8080/api;
            # connection will be closed if no data is read for 600s between successive read operations
            proxy_read_timeout 600s; 
        }

        location /ws {
            proxy_pass  http://query-service:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signoz-query-service-data
  namespace: iresharma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Holds query-service's local sqlite db: SigNoz UI users, saved
      # dashboards, and alert rules. Must persist across restarts.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: iresharma
  labels:
    app: alertmanager
  annotations:
    # Wait for clickhouse (wave 0, default) and the schema-migrator Job
    # (wave 1) to go Healthy first - see apps/signoz-migrator.yaml.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: signoz/alertmanager:0.23.7
          args:
            - --queryService.url=http://query-service:8085
            - --storage.path=/data
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
      volumes:
        # Alert silences/notification state - fine to lose on a pod restart
        # in a homelab; not worth another PVC for.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: iresharma
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: iresharma
  labels:
    app: query-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: signoz/query-service:0.69.0
          # `args`, not `command` - see apps/signoz-migrator.yaml for why.
          args:
            - "-config=/root/config/prometheus.yml"
            - "--use-logs-new-schema=true"
            - "--use-trace-new-schema=true"
          env:
            - name: ClickHouseUrl
              value: tcp://clickhouse:9000
            - name: ALERTMANAGER_API_PREFIX
              value: http://alertmanager:9093/api/
            - name: SIGNOZ_LOCAL_DB_PATH
              value: /var/lib/signoz/signoz.db
            - name: STORAGE
              value: clickhouse
            - name: GODEBUG
              value: netdns=go
            - name: DEPLOYMENT_TYPE
              value: kubernetes
            # Opt out of SigNoz's own product-usage telemetry - not needed
            # for a homelab and this whole deployment is about *our* apps'
            # telemetry, not SigNoz's own.
            - name: TELEMETRY_ENABLED
              value: "false"
          ports:
            - containerPort: 8080
            - containerPort: 8085
          volumeMounts:
            - name: config
              mountPath: /root/config/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /root/config/alerts.yml
              subPath: alerts.yml
            - name: data
              mountPath: /var/lib/signoz
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: 300m
      volumes:
        - name: config
          configMap:
            name: signoz-query-service-config
        - name: data
          persistentVolumeClaim:
            claimName: signoz-query-service-data
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: iresharma
spec:
  selector:
    app: query-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: alertmanager-sync
      port: 8085
      targetPort: 8085
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: iresharma
  labels:
    app: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: signoz/frontend:0.69.0
          ports:
            - containerPort: 3301
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-config.conf
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: nginx-config
          configMap:
            name: signoz-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: iresharma
spec:
  selector:
    app: frontend
  ports:
    - port: 3301
      targetPort: 3301
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signoz
  namespace: iresharma
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: signoz.tenant.uttutu.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3301
  tls:
    - hosts:
        - signoz.tenant.uttutu.xyz
      secretName: signoz-tls
